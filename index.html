itle{text-decoration:line-through;color:#949e97}.task-details{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:7px}.tag{font-size:10px;border-radius:4px;padding:4px 7px;color:#65716b;background:#f2f4f0}.tag.category-family{background:var(--green-pale);color:var(--green-dark)}.tag.category-errands{background:var(--gold-pale);color:#856323}.tag.category-shopping{background:var(--coral-pale);color:#a55039}.tag.category-growth{background:var(--blue-pale);color:#4d7189}.tag.category-home{background:#f1edf5;color:#7d638b}.tag.category-wellbeing{background:#edf2e7;color:#687c50}.task-due{font-size:10px;color:var(--muted);display:inline-flex;align-items:center;gap:4px}.task-note{font-size:11px;color:var(--muted);margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}.task-actions{display:flex;gap:2px;opacity:.2;transition:opacity .15s}.task:hover .task-actions,.task-actions:focus-within{opacity:1}.task-actions button{border:0;background:transparent;color:#7c8981;width:28px;height:28px;border-radius:5px;display:grid;place-items:center}.task-actions button:hover{background:#f0f4ef;color:var(--green)}.task-actions .delete:hover{color:#b84c3b;background:var(--coral-pale)}.empty{border:1px dashed #d4ddd4;border-radius:8px;padding:44px 15px;text-align:center;color:var(--muted);background:rgba(255,255,255,.45)}.empty-icon{width:42px;height:42px;border-radius:50%;background:var(--green-pale);display:grid;place-items:center;color:var(--green);margin:0 auto 12px}.empty-icon i{font-size:20px}.empty strong{display:block;color:var(--ink);font-size:13px}.empty p{margin:5px 0 0;font-size:11px}
    .overlay{position:fixed;inset:0;background:#1e302c66;z-index:5;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s ease}@keyframes fade{from{opacity:0}to{opacity:1}}.dialog{width:min(470px,100%);max-height:92vh;overflow:auto;background:var(--paper);border-radius:9px;padding:22px;box-shadow:0 24px 70px #182d2660}.dialog-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.dialog-head h3{font:600 21px Fraunces,serif;margin:0}.close{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:5px;display:grid;place-items:center}.close:hover{background:#f0f4ef}.field{margin-bottom:13px}.field label{display:block;font-size:10px;text-transform:uppercase;font-weight:700;color:#66736c;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:6px;background:#fcfdfa;color:var(--ink);padding:10px 11px;font-size:12px}.field textarea{min-height:78px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;padding-top:8px}.btn{border:1px solid var(--line);border-radius:6px;background:white;padding:9px 13px;color:#5d6a62;font-size:11px;font-weight:700}.btn.primary{border-color:var(--green);background:var(--green);color:white}.btn.primary:hover{background:var(--green-dark)}.btn:disabled{opacity:.55;cursor:wait}.message{font-size:11px;color:var(--muted);margin-top:11px;min-height:16px}.sync-hint{font-size:11px;line-height:1.5;background:#f3f6f1;padding:11px;border-radius:6px;color:#65716b;margin-bottom:15px}.login-field{margin-top:13px}.section-rule{height:1px;background:var(--line);margin:17px 0}
    @media(max-width:760px){.shell{grid-template-columns:minmax(0,1fr)}.sidebar{min-width:0;padding:12px 14px;border-right:0;border-bottom:1px solid var(--line);gap:9px}.brand{padding:0 3px}.brand-mark{width:32px;height:32px}.side-section{display:none}.sidebar>.side-label{display:none}.nav-list{display:flex;min-width:0;overflow-x:auto;gap:5px}.nav-button{width:auto;white-space:nowrap;padding:8px 10px;font-size:11px;gap:7px;flex:none}.nav-button i{font-size:15px}.side-bottom{display:none}.main{padding:22px 16px 45px}.topline{margin-bottom:23px}.greeting{font-size:27px}.overview{gap:7px}.metric{padding:11px 10px;min-height:76px}.metric-top{font-size:10px}.metric-top i{display:none}.metric strong{font-size:20px}.task-head h2{font-size:18px}.task-head .subcount{display:block;margin:3px 0 0;font-size:10px}.task-head{align-items:flex-end}.tools-row{flex-wrap:wrap}.search{max-width:none;flex-basis:100%}.select-filter{flex:1;min-width:0}.task{padding:12px}.task-actions{opacity:1}.date-label{font-size:11px}}
    @media(max-width:390px){.overview{grid-template-columns:repeat(3,minmax(0,1fr))}.metric{padding:10px 8px}.metric-top{font-size:9px}.metric strong{font-size:18px}.avatar{display:none}.greeting{font-size:25px}.form-grid{grid-template-columns:1fr}.new-button{padding:9px 10px}}

<body>
  <div id="app"></div>
  <script>
    const CATEGORIES = {
      family: 'Family', errands: 'Errands', shopping: 'Shopping', growth: 'Skill building',
      home: 'Home', wellbeing: 'Wellbeing'
    };
    const CATEGORY_ICONS = {family:'users-round',errands:'route',shopping:'shopping-bag',growth:'book-open',home:'house',wellbeing:'heart'};
    const STORAGE_KEY = 'plansurf-personal-todos-v1';
    const DELETED_KEY = 'plansurf-personal-todo-deletions-v1';
    const API_BASE = 'https://plansurf-service.onrender.com';
    const APP_KEY = 'todo';
    const appRoute = action => `/api/${APP_KEY}/${action}`;
    let token = '';
    const state = {
      tasks: loadTasks(), deletedTaskIds: loadDeletedTaskIds(), view: 'today', category: 'all', query: '', modal: null,
      syncing: false, syncMessage: 'Local changes are saved in this browser.', signedIn: false
    };
    function loadTasks() {
      try { const parsed = JSON.parse(localStorage.getItem(STORAGE_KEY)); return Array.isArray(parsed) ? parsed : []; }
      catch { return []; }
    }
    function loadDeletedTaskIds() {
      try { const parsed = JSON.parse(localStorage.getItem(DELETED_KEY)); return new Set(Array.isArray(parsed) ? parsed.filter(id => typeof id === 'string') : []); }
      catch { return new Set(); }
    }
    function persist() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.tasks)); } catch {}
      try { localStorage.setItem(DELETED_KEY, JSON.stringify([...state.deletedTaskIds])); } catch {}
      render();
    }
    function todayKey() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function uid() { return Math.random().toString(36).slice(2,9) + Date.now().toString(36); }
    function dateText(key) {
      if (!key) return '';
      const date = new Date(`${key}T12:00:00`);
      if (key === todayKey()) return 'Today';
      const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
      if (key === `${tomorrow.getFullYear()}-${String(tomorrow.getMonth()+1).padStart(2,'0')}-${String(tomorrow.getDate()).padStart(2,'0')}`) return 'Tomorrow';
      return date.toLocaleDateString(undefined,{month:'short',day:'numeric'});
    }
    function greeting() {
      const hour = new Date().getHours();
      return hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
    }
    function escapeHTML(value='') {
      return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    }
    function visibleTasks() {
      let tasks = state.tasks.filter(task => state.category === 'all' || task.category === state.category);
      const today = todayKey();
      if (state.view === 'today') tasks = tasks.filter(task => task.dueDate === today || (task.dueDate < today && !task.completed));
      if (state.view === 'upcoming') tasks = tasks.filter(task => !task.completed && task.dueDate > today);
      if (state.view === 'unscheduled') tasks = tasks.filter(task => !task.completed && !task.dueDate);
      if (state.view === 'completed') tasks = tasks.filter(task => task.completed);
      if (state.query.trim()) {
        const query = state.query.toLowerCase();
        tasks = tasks.filter(task => `${task.title} ${task.notes || ''} ${CATEGORIES[task.category] || ''}`.toLowerCase().includes(query));
      }
      if (state.priority && state.priority !== 'all') tasks=tasks.filter(task=>task.priority===state.priority);
      return tasks.sort((a,b) => (a.completed-b.completed) || ((a.dueDate || '9999').localeCompare(b.dueDate || '9999')) || (({high:0,medium:1,low:2}[a.priority]??1) - ({high:0,medium:1,low:2}[b.priority]??1)) || (b.createdAt-a.createdAt));
    }
    function taskMarkup(task) {
      const due = task.dueDate ? `<span class="task-due"><i class="icon icon-calendar-days"></i>${dateText(task.dueDate)}</span>` : '';
      const priority = task.priority === 'high' ? '<span class="tag" style="background:var(--coral-pale);color:#a55039">High priority</span>' : task.priority === 'low' ? '<span class="tag">Low priority</span>' : '';
      return `<article class="task ${task.completed?'is-done':''}" data-task="${escapeHTML(task.id)}">
        <button class="task-check" data-action="toggle" aria-label="${task.completed?'Mark incomplete':'Complete task'}"><i class="icon icon-check"></i></button>
        <div class="task-content"><div class="task-title">${escapeHTML(task.title)}</div><div class="task-details"><span class="tag category-${escapeHTML(task.category)}">${escapeHTML(CATEGORIES[task.category] || 'Personal')}</span>${priority}${due}</div>${task.notes?`<div class="task-note">${escapeHTML(task.notes)}</div>`:''}</div>
        <div class="task-actions"><button data-action="edit" title="Edit task" aria-label="Edit task"><i class="icon icon-pencil"></i></button><button class="delete" data-action="delete" title="Delete task" aria-label="Delete task"><i class="icon icon-trash-2"></i></button></div>
      </article>`;
    }
    function render() {
      const today = todayKey();
      const open = state.tasks.filter(task => !task.completed);
      const todayTasks = open.filter(task => task.dueDate && task.dueDate <= today);
      const upcomingTasks = open.filter(task => task.dueDate > today);
      const completedToday = state.tasks.filter(task => task.completed && task.completedAt && new Date(task.completedAt).toDateString() === new Date().toDateString()).length;
      const items = visibleTasks();
      const nav = [['today','bell','Reminders',todayTasks.length],['upcoming','calendar-days','Coming up',upcomingTasks.length],['unscheduled','inbox','No date',open.filter(t=>!t.dueDate).length],['completed','circle-check','Completed',state.tasks.filter(t=>t.completed).length]];
      const currentTitle = ({today:'Reminders',upcoming:'Coming up',unscheduled:'No date',completed:'Completed'})[state.view] || 'Reminders';
      document.getElementById('app').innerHTML = `<div class="shell">
        <aside class="sidebar">
          <div class="brand"><div class="brand-mark"><i class="icon icon-check-check"></i></div><div class="brand-name">PlanSurf<small>PERSONAL</small></div></div>
          <div class="side-label">Your space</div>
          <nav class="nav-list">${nav.map(([id,icon,label,count])=>`<button class="nav-button ${state.view===id?'active':''}" data-view="${id}"><i class="icon icon-${icon}"></i><span>${label}</span><span class="nav-count">${count||''}</span></button>`).join('')}</nav>
          <div class="side-section"><div class="side-label">Categories</div>${Object.entries(CATEGORIES).map(([key,label])=>`<div class="category-row"><span class="category-dot"></span>${label}</div>`).join('')}</div>
          <div class="side-bottom"><div class="sync-mini"><span class="sync-light ${state.signedIn?'on':''}"></span><span>${escapeHTML(state.syncMessage)}</span></div><div class="side-actions"><button data-action="backup"><i class="icon icon-download"></i> Export</button><button data-action="sync"><i class="icon icon-cloud"></i> Cloud sync</button></div></div>
        </aside>
        <main class="main">
          <div class="topline"><div class="date-label">${new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</div><div class="top-actions"><button class="icon-button" data-action="sync" title="Cloud sync" aria-label="Cloud sync"><i class="icon icon-cloud"></i></button><div class="avatar">${new Date().toLocaleDateString(undefined,{month:'short'}).toUpperCase()}</div></div></div>
          <h1 class="greeting">${greeting()}, Taha.</h1><p class="intro">Your friendly little nudge list. No rush, just reminders when you need them ✨</p>
          <section class="overview"><div class="metric"><div class="metric-top"><span>On your mind</span><i class="icon icon-bell"></i></div><strong>${todayTasks.length}</strong></div><div class="metric"><div class="metric-top"><span>Coming up</span><i class="icon icon-calendar-days"></i></div><strong>${upcomingTasks.length}</strong></div><div class="metric"><div class="metric-top"><span>Little wins today</span><i class="icon icon-sparkles"></i></div><strong>${completedToday}</strong></div></section>
          <div class="task-head"><h2>${currentTitle}<span class="subcount">${items.length} ${items.length===1?'reminder':'reminders'}</span></h2><button class="new-button" data-action="new"><i class="icon icon-plus"></i> Add reminder</button></div>
          <div class="tools-row"><label class="search"><i class="icon icon-search"></i><input id="search" type="search" placeholder="Find a reminder..." value="${escapeHTML(state.query)}" aria-label="Search reminders"></label><select class="select-filter" id="category-filter" aria-label="Filter by category"><option value="all">Every category</option>${Object.entries(CATEGORIES).map(([key,label])=>`<option value="${key}" ${state.category===key?'selected':''}>${label}</option>`).join('')}</select><select class="select-filter" id="priority-filter" aria-label="Filter by priority"><option value="all">Any priority</option><option value="high" ${state.priority==='high'?'selected':''}>High priority</option><option value="medium" ${state.priority==='medium'?'selected':''}>Medium priority</option><option value="low" ${state.priority==='low'?'selected':''}>Low priority</option></select></div>
          <section class="task-list">${items.length?items.map(taskMarkup).join(''):`          <div class="empty"><div class="empty-icon"><i class="icon icon-sparkles"></i></div><strong>${state.query?'No matching reminders':state.view==='today'?'All clear for now!':state.view==='upcoming'?'Nothing coming up yet':state.view==='completed'?'No little wins just yet':'No reminders without a date'}</strong><p>${state.query?'Try a different search or category.':'Add a reminder whenever something comes to mind.'}</p></div>`}</section>
        </main>${state.modal?modalMarkup():''}</div>`;
      bindEvents();
    }
    function modalMarkup() {
      const modal = state.modal;
      if (modal.type === 'sync') return `<div class="overlay" data-action="outside"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-head"><h3 id="dialog-title">PlanSurf cloud sync</h3><button class="close" data-action="close" aria-label="Close"><i class="icon icon-x"></i></button></div><div class="sync-hint">Sign in with the password you already use for PlanSurf. Todo tasks are stored separately from your other PlanSurf data.</div>${!state.signedIn?`<div class="field login-field"><label for="sync-password">Password</label><input id="sync-password" type="password" autocomplete="current-password" placeholder="Your PlanSurf password"></div>`:''}<div class="message" id="sync-message">${escapeHTML(state.syncMessage)}</div><div class="dialog-actions"><button class="btn" data-action="close">Close</button>${state.signedIn?`<button class="btn" data-action="pull" ${state.syncing?'disabled':''}>Pull tasks</button><button class="btn primary" data-action="push" ${state.syncing?'disabled':''}>Save to cloud</button><button class="btn" data-action="logout">Sign out</button>`:`<button class="btn primary" data-action="login" ${state.syncing?'disabled':''}>${state.syncing?'Signing in...':'Sign in'}</button>`}</div></section></div>`;
      const task = modal.task || {title:'',category:'family',dueDate:todayKey(),priority:'medium',notes:''};
      return `<div class="overlay" data-action="outside"><form class="dialog" id="task-form" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="dialog-head"><h3 id="dialog-title">${modal.task?'Edit reminder':'New reminder'}</h3><button type="button" class="close" data-action="close" aria-label="Close"><i class="icon icon-x"></i></button></div><div class="field"><label for="task-title">What do you want to remember?</label><input id="task-title" name="title" required maxlength="160" placeholder="e.g. Book the dentist appointment" value="${escapeHTML(task.title)}" autofocus></div><div class="form-grid"><div class="field"><label for="task-category">Category</label><select id="task-category" name="category">${Object.entries(CATEGORIES).map(([key,label])=>`<option value="${key}" ${task.category===key?'selected':''}>${label}</option>`).join('')}</select></div><div class="field"><label for="task-priority">Priority</label><select id="task-priority" name="priority"><option value="high" ${task.priority==='high'?'selected':''}>High</option><option value="medium" ${task.priority==='medium'?'selected':''}>Medium</option><option value="low" ${task.priority==='low'?'selected':''}>Low</option></select></div></div><div class="field"><label for="task-date">Reminder date</label><input id="task-date" name="dueDate" type="date" value="${escapeHTML(task.dueDate||'')}"></div><div class="field"><label for="task-notes">Notes</label><textarea id="task-notes" name="notes" placeholder="Details, list items, or a helpful reminder">${escapeHTML(task.notes||'')}</textarea></div><div class="dialog-actions"><button type="button" class="btn" data-action="close">Cancel</button><button class="btn primary" type="submit">${modal.task?'Save changes':'Add to my list'}</button></div></form></div>`;
    }
    function bindEvents() {
      document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click',()=>{state.view=button.dataset.view;state.category='all';render()}));
      document.querySelectorAll('[data-action]').forEach(button => button.addEventListener('click',event=>{
        const action=button.dataset.action;
        if (action==='outside') { if(event.target===button){state.modal=null;render()} return; }
        const card=button.closest('[data-task]');
        if (action==='new') { state.modal={type:'task'};render();document.getElementById('task-title')?.focus(); }
        if (action==='close') { state.modal=null;render(); }
        if (action==='toggle' && card) { const task=state.tasks.find(item=>item.id===card.dataset.task);task.completed=!task.completed;task.completedAt=task.completed?new Date().toISOString():null;persist(); }
        if (action==='delete' && card) { const task=state.tasks.find(item=>item.id===card.dataset.task);if(confirm(`Delete “${task.title}”?`)){state.deletedTaskIds.add(task.id);state.tasks=state.tasks.filter(item=>item.id!==task.id);persist();} }
        if (action==='edit' && card) { state.modal={type:'task',task:state.tasks.find(item=>item.id===card.dataset.task)};render();document.getElementById('task-title')?.focus(); }
        if (action==='sync') { state.modal={type:'sync'};render(); }
        if (action==='backup') exportTasks();
        if (action==='login') login();
        if (action==='push') pushTasks();
        if (action==='pull') pullTasks();
        if (action==='logout') logout();
      }));
      document.getElementById('task-form')?.addEventListener('submit',event=>{
        event.preventDefault();const data=Object.fromEntries(new FormData(event.currentTarget));
        if(state.modal.task) Object.assign(state.modal.task,data);
        else state.tasks.push({...data,id:uid(),completed:false,createdAt:Date.now(),completedAt:null});
        state.modal=null;persist();
      });
      const search=document.getElementById('search');
      search?.addEventListener('input',()=>{const position=search.selectionStart;state.query=search.value;render();const next=document.getElementById('search');next.focus();next.setSelectionRange(position,position);});
      document.getElementById('category-filter')?.addEventListener('change',event=>{state.category=event.target.value;render()});
      document.getElementById('priority-filter')?.addEventListener('change',event=>{state.priority=event.target.value;render()});
    }
    function exportTasks() {
      const data={app:'plansurf-personal-todos',version:1,exportedAt:new Date().toISOString(),tasks:state.tasks};
      const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));
      const link=document.createElement('a');link.href=url;link.download=`plansurf-todos-${todayKey()}.json`;link.click();URL.revokeObjectURL(url);
    }
    async function apiRequest(path,options={}) {
      const response=await fetch(`${API_BASE}${path}`,{...options,headers:{'Content-Type':'application/json',...(token?{Authorization:`Bearer ${token}`}:{}) ,...(options.headers||{})},cache:'no-store'});
      const payload=await response.json().catch(()=>({error:'The service returned an invalid response.'}));
      if(!response.ok)throw new Error(payload.error||payload.message||`Request failed (${response.status}).`);
      return payload;
    }
    async function login() {
      const password=document.getElementById('sync-password')?.value;
      if(!password)return;
      state.syncing=true;state.syncMessage='Signing in...';render();
      try{const result=await apiRequest(appRoute('login'),{method:'POST',body:JSON.stringify({password})});if(!result.token)throw new Error('The service did not return a session token.');token=result.token;state.signedIn=true;state.syncMessage='Signed in. Your local tasks are ready to sync.';}
      catch(error){state.syncMessage=`Sign in failed: ${error.message}`;}
      finally{state.syncing=false;render();}
    }
    function mergeTasks(existing,incoming,preferIncoming=true) {
      const merged=Array.isArray(existing)?existing.map(task=>({...task})):[];
      const positions=new Map(merged.map((task,index)=>[task.id,index]));
      (Array.isArray(incoming)?incoming:[]).forEach(task=>{
        if(!task||typeof task.id!=='string')return;
        const index=positions.get(task.id);
        if(index===undefined){positions.set(task.id,merged.length);merged.push(task)}
        else if(preferIncoming)merged[index]=task;
      });
      return merged;
    }
    function validateTodoData(data) {
      return data&&typeof data==='object'&&!Array.isArray(data)&&(Object.keys(data).length===0||Array.isArray(data.tasks))&&(!data.deletedTaskIds||Array.isArray(data.deletedTaskIds));
    }
    async function pushTasks() {
      if(!token)return;
      state.syncing=true;state.syncMessage='Combining local and cloud tasks...';render();
      try{
        const saved=await apiRequest(appRoute('data'));
        if(!validateTodoData(saved))throw new Error('Saved todo data has an unexpected format. Nothing was changed.');
        const deletedTaskIds=new Set([...state.deletedTaskIds,...(Array.isArray(saved.deletedTaskIds)?saved.deletedTaskIds.filter(id=>typeof id==='string'):[])]);
        const merged=mergeTasks(saved.tasks,state.tasks,true).filter(task=>!deletedTaskIds.has(task.id));
        await apiRequest(appRoute('data'),{method:'PUT',body:JSON.stringify({...saved,app:`plansurf-${APP_KEY}`,version:1,tasks:merged,deletedTaskIds:[...deletedTaskIds],updatedAt:new Date().toISOString()})});
        state.tasks=merged;state.deletedTaskIds=deletedTaskIds;
        state.syncMessage='Personal tasks saved to PlanSurf cloud.';
        persist();
      }catch(error){state.syncMessage=`Cloud save failed: ${error.message}`;if(/unauthorized|invalid or expired token|sign in/i.test(error.message)){token='';state.signedIn=false}}
      finally{state.syncing=false;render();}
    }
    async function pullTasks() {
      if(!token)return;
      if(state.tasks.length&&!confirm('Merge cloud tasks into this browser? Matching task IDs will use the cloud version.'))return;
      state.syncing=true;state.syncMessage='Loading tasks from cloud...';render();
      try{
        const saved=await apiRequest(appRoute('data'));
        if(!validateTodoData(saved))throw new Error('Saved todo data has an unexpected format.');
        state.deletedTaskIds=new Set([...state.deletedTaskIds,...(Array.isArray(saved.deletedTaskIds)?saved.deletedTaskIds.filter(id=>typeof id==='string'):[])]);
        state.tasks=mergeTasks(state.tasks,saved.tasks,true).filter(task=>!state.deletedTaskIds.has(task.id));
        state.syncMessage='Cloud tasks merged into this browser.';
        persist();
      }catch(error){state.syncMessage=`Cloud pull failed: ${error.message}`;if(/unauthorized|invalid or expired token|sign in/i.test(error.message)){token='';state.signedIn=false}}
      finally{state.syncing=false;render();}
    }
    async function logout() {
      try{if(token)await apiRequest(appRoute('logout'),{method:'POST'})}catch{}
      token='';state.signedIn=false;state.syncMessage='Signed out. Local tasks are still available.';render();
    }
    document.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.modal){state.modal=null;render()}if((event.metaKey||event.ctrlKey)&&event.key==='Enter'&&state.modal?.type==='task')document.getElementById('task-form')?.requestSubmit()});
    render();
  </script>
</body>
</html>
